name: Deploy KOSH Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/kosh-frontend.pem
          chmod 600 ~/.ssh/kosh-frontend.pem

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/kosh-frontend.pem \
            $EC2_USER@$EC2_HOST << 'EOF'

            cd ~/Kosh-frontend

            git pull origin main

            npm install

            npm run build

            sudo rm -rf /var/www/inventory/*
            sudo cp -r dist/* /var/www/inventory/

            sudo nginx -t
            sudo systemctl reload nginx

          EOF