name: Deploy KOSH Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to EC2
        run: |
          cd ~/Kosh-frontend

          git pull origin main

          npm install

          npm run build

          sudo rm -rf /var/www/inventory/*
          sudo cp -r dist/* /var/www/inventory/

          sudo nginx -t
          sudo systemctl reload nginx
